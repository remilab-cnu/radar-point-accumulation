name: srep-gesture-transfer-probe
description: "P-SWING go/no-go: cross-sensor linear-probe transfer mHomeGes<->Infineon, velocity-distribution vs calibrated-scalar baseline"
tags: [srep-gesture, novelty-swing, transfer-probe]
resources:
  cluster: remilab-c0
  preset: gpu-rtx4090
image: nvcr.io/nvidia/pytorch:24.10-py3
env:
  PYTHONUNBUFFERED: "1"
  LANG: "C.UTF-8"
mount:
  /root/workspace/: volume://<your-volume>/
run: |-
  set -eu
  cd /path/to/this/repo/src
  python -m pip install -q pandas scipy scikit-learn
  python -u rep_transfer.py
  echo "TRANSFER PROBE DONE"
