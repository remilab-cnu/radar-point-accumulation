name: srep-gesture-multi-stream
description: "Multi-gesture streaming: concatenate different-class instances -> A-B-C streams (rest vs co-articulated), causal window + debouncer, detection metrics (event F1/FP-min/latency/edit); offline->online collapse"
tags: [srep-gesture, segmentation, streaming]
resources:
  cluster: remilab-c0
  preset: gpu-rtx4090
image: nvcr.io/nvidia/pytorch:24.10-py3
env:
  PYTHONUNBUFFERED: "1"
  LANG: "C.UTF-8"
mount:
  /root/workspace/: volume://<your-volume>/
run: |-
  set -eu
  cd /root/workspace/bk-workspace/papers/Papers/On-going/SREP-hand-gesture/experiments/src
  python -m pip install -q pandas scipy scikit-learn
  python -u multi_gesture_stream.py
  echo "MULTI STREAM DONE"
