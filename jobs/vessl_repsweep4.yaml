name: srep-gesture-repsweep-round4
description: "Round 4: mHomeGes gap-closing (3-crop aug + intensity channels, batch128) + FAIRNESS bars (DeepSets with same aug; grad-clip-fixed FramePointGRU); Infineon transfer"
tags: [srep-gesture, repsweep, round4]
resources:
  cluster: remilab-c0
  preset: gpu-rtx4090
image: nvcr.io/nvidia/pytorch:24.10-py3
env:
  PYTHONUNBUFFERED: "1"
  LANG: "C.UTF-8"
mount:
  /root/workspace/: volume://<your-volume>/
run: |-
  set -eu
  cd /root/workspace/bk-workspace/papers/Papers/On-going/SREP-hand-gesture/experiments/src
  python -m pip install -q pandas scipy scikit-learn
  python -u rep_round4.py
  echo "ROUND4 DONE"
