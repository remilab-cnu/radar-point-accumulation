name: srep-gesture-rerun-ds
description: "Audit rerun R4: DeepSets missing cells + train-acc instrumentation on mH/MM-Fi/Infineon (symmetric UF gate)"
tags: [srep-gesture, audit-rerun, table3]
resources:
  cluster: remilab-c0
  preset: gpu-rtx4090
image: nvcr.io/nvidia/pytorch:24.10-py3
env:
  PYTHONUNBUFFERED: "1"
  LANG: "C.UTF-8"
  RERUN_PART: "ds"
mount:
  /root/workspace/: volume://<your-volume>/
run: |-
  set -eu
  cd /root/workspace/bk-workspace/papers/Papers/On-going/SREP-hand-gesture/experiments/src
  python -m pip install -q pandas scipy scikit-learn
  python -u rep_rerun_audit.py
  echo "RERUN DS DONE"
