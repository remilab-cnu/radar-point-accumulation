name: srep-gesture-foldwise-ext
description: "Major-revision campaign 2026-08-18: foldwise_ext (review round: ep160-200 extension under fold-wise ranges)"
tags: [srep-gesture, tim-revision, major-revision-2026-08]
resources:
  cluster: remilab-c0
  preset: gpu-rtx4090
image: nvcr.io/nvidia/pytorch:24.10-py3
env:
  PYTHONUNBUFFERED: "1"
  LANG: "C.UTF-8"
mount:
  /root/workspace/: volume://<your-volume>/
run: |-
  set -eu
  cd /path/to/this/repo/src
  python -m pip install -q pandas scipy scikit-learn
  SMOKE=1 python -u rep_foldwise_ext.py
  python -u rep_foldwise_ext.py
  echo "FOLDWISE_LADDER DONE"
