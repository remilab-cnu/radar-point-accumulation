name: srep-gesture-p1-crossparadigm
description: "P1 cross-paradigm quantity factorial: DeepSets+GRU x {occupancy,intensity,velocity,full} point-feature sets x 3 datasets, frozen protocol ep30&40 batch64 seeds0-2, preds saved"
tags: [srep-gesture, p1, factorial, audit-compliant]
resources:
  cluster: remilab-c0
  preset: gpu-rtx4090
image: nvcr.io/nvidia/pytorch:24.10-py3
env:
  PYTHONUNBUFFERED: "1"
  LANG: "C.UTF-8"
mount:
  /root/workspace/: volume://<your-volume>/
run: |-
  set -eu
  cd /path/to/this/repo/src
  python -m pip install -q pandas scipy scikit-learn
  python -u rep_p1.py
  echo "P1 DONE"
