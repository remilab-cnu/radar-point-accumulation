name: srep-gesture-repsweep-round3
description: "Round 3: close mHomeGes gap to DeepSets bar (79.9) - plane-projection joint-structure channels (xy/xz/yz x 4 chunks) + sliding-window aug + width-48 CNN; Infineon transfer check"
tags: [srep-gesture, repsweep, round3]
resources:
  cluster: remilab-c0
  preset: gpu-rtx4090
image: nvcr.io/nvidia/pytorch:24.10-py3
env:
  PYTHONUNBUFFERED: "1"
  LANG: "C.UTF-8"
mount:
  /root/workspace/: volume://<your-volume>/
run: |-
  set -eu
  cd /path/to/this/repo/src
  python -m pip install -q pandas scipy scikit-learn
  python -u rep_round3.py
  echo "ROUND3 DONE"
