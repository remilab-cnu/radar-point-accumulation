name: srep-gesture-seg-gap-derisk
description: "Motion-segmentation de-risk: trimmed-clip vs online-continuous collapse on Infineon streams (per-frame GT); measures the deployment gap"
tags: [srep-gesture, segmentation, de-risk]
resources:
  cluster: remilab-c0
  preset: gpu-rtx4090
image: nvcr.io/nvidia/pytorch:24.10-py3
env:
  PYTHONUNBUFFERED: "1"
  LANG: "C.UTF-8"
mount:
  /root/workspace/: volume://<your-volume>/
run: |-
  set -eu
  cd /path/to/this/repo/src
  python -m pip install -q pandas scipy scikit-learn
  python -u seg_gap_derisk.py
  echo "SEG GAP DERISK DONE"
