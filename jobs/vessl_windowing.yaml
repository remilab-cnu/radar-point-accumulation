name: srep-gesture-windowing-sensitivity
description: "Windowing sensitivity: does how you cut the stream (gesture/prep/retract/full/fixed-naive/whole) change gesture-recognition accuracy? spread across windowings"
tags: [srep-gesture, segmentation, windowing]
resources:
  cluster: remilab-c0
  preset: gpu-rtx4090
image: nvcr.io/nvidia/pytorch:24.10-py3
env:
  PYTHONUNBUFFERED: "1"
  LANG: "C.UTF-8"
mount:
  /root/workspace/: volume://<your-volume>/
run: |-
  set -eu
  cd /root/workspace/bk-workspace/papers/Papers/On-going/SREP-hand-gesture/experiments/src
  python -m pip install -q pandas scipy scikit-learn
  python -u windowing_sensitivity.py
  echo "WINDOWING SENSITIVITY DONE"
