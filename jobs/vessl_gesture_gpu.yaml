name: srep-gesture-pointset-v1
description: "Gesture paper GPU experiments: point-set (RawSet) baselines + feature ablations on mHomeGes/Infineon/MM-Fi, then velocity-resolution sweep"
tags: [srep-gesture, pointset, cross-subject]
resources:
  cluster: remilab-c0
  preset: gpu-rtx4090
image: nvcr.io/nvidia/pytorch:24.10-py3
env:
  PYTHONUNBUFFERED: "1"
  LANG: "C.UTF-8"
mount:
  /root/workspace/: volume://<your-volume>/
run: |-
  set -eu
  cd /path/to/this/repo/src
  python -m pip install -q pandas scipy scikit-learn
  python -c "import torch; print('torch', torch.__version__, '| cuda', torch.cuda.is_available(), torch.cuda.get_device_name(0) if torch.cuda.is_available() else '')"
  echo "=== 1/2 point-set baselines (RawSet control + feature ablations) ==="
  python -u run_pointset.py
  echo "=== 2/2 velocity-resolution sweep ==="
  python -u vres_sweep.py
  echo "ALL DONE"
