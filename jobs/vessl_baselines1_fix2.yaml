name: srep-gesture-baselines1-fix2
description: "mHomeGes baseline collapse diagnosis + lr 3e-4 equal-HPO pass"
tags: [srep-gesture, baselines, equal-hpo]
resources:
  cluster: remilab-c0
  preset: gpu-rtx4090
image: nvcr.io/nvidia/pytorch:24.10-py3
env:
  PYTHONUNBUFFERED: "1"
  LANG: "C.UTF-8"
mount:
  /root/workspace/: volume://<your-volume>/
run: |-
  set -eu
  cd /path/to/this/repo/src
  python -m pip install -q pandas scipy scikit-learn
  python -u run_baselines1_fix2.py
  echo "BASELINES1 DONE"
