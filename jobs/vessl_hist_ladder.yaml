name: srep-gesture-hist-ladder
description: "Major-revision campaign 2026-08-18: hist_ladder (review round: fold-wise refit / reducer factorial / hist ladder)"
tags: [srep-gesture, tim-revision, major-revision-2026-08]
resources:
  cluster: remilab-c0
  preset: gpu-rtx4090
image: nvcr.io/nvidia/pytorch:24.10-py3
env:
  PYTHONUNBUFFERED: "1"
  LANG: "C.UTF-8"
mount:
  /root/workspace/: volume://<your-volume>/
run: |-
  set -eu
  cd /path/to/this/repo/src
  python -m pip install -q pandas scipy scikit-learn
  SMOKE=1 python -u rep_hist_ladder.py
  python -u rep_hist_ladder.py
  echo "HIST_LADDER DONE"
