name: srep-gesture-baselines1
description: "Published baselines 1/4: PointNet++ (masked SSG) + DGCNN(+temporal) on mHomeGes/Infineon/MM-Fi, frozen equal-HPO protocol, preds saved, underfit gates"
tags: [srep-gesture, baselines, equal-hpo]
resources:
  cluster: remilab-c0
  preset: gpu-rtx4090
image: nvcr.io/nvidia/pytorch:24.10-py3
env:
  PYTHONUNBUFFERED: "1"
  LANG: "C.UTF-8"
mount:
  /root/workspace/: volume://<your-volume>/
run: |-
  set -eu
  cd /root/workspace/bk-workspace/papers/Papers/On-going/SREP-hand-gesture/experiments/src
  python -m pip install -q pandas scipy scikit-learn
  python -u run_baselines1.py
  echo "BASELINES1 DONE"
