name: srep-gesture-repsweep-round5
description: "Round 5: final map levers (8-chunk / multiscale planes) + per-class error analysis (best map vs DeepSets_aug3) + FIXED FramePointGRU bars"
tags: [srep-gesture, repsweep, round5]
resources:
  cluster: remilab-c0
  preset: gpu-rtx4090
image: nvcr.io/nvidia/pytorch:24.10-py3
env:
  PYTHONUNBUFFERED: "1"
  LANG: "C.UTF-8"
mount:
  /root/workspace/: volume://<your-volume>/
run: |-
  set -eu
  cd /root/workspace/bk-workspace/papers/Papers/On-going/SREP-hand-gesture/experiments/src
  python -m pip install -q pandas scipy scikit-learn
  python -u rep_round5.py
  echo "ROUND5 DONE"
