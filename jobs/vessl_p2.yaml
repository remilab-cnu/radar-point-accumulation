name: srep-gesture-p2-boundary
description: "P2 boundary predictor: per-class overlap predictor vs CNN recall deltas (3 datasets pooled, Spearman+CI) + pre-registered FINE/GROSS sign prediction + held-out subset retrains"
tags: [srep-gesture, p2, mechanism, audit-compliant]
resources:
  cluster: remilab-c0
  preset: gpu-rtx4090
image: nvcr.io/nvidia/pytorch:24.10-py3
env:
  PYTHONUNBUFFERED: "1"
  LANG: "C.UTF-8"
mount:
  /root/workspace/: volume://<your-volume>/
run: |-
  set -eu
  cd /root/workspace/bk-workspace/papers/Papers/On-going/SREP-hand-gesture/experiments/src
  python -m pip install -q pandas scipy scikit-learn
  python -u rep_p2.py
  echo "P2 DONE"
