name: srep-gesture-repsweep-v1
description: "Velocity-spectrogram design sweep: 18 representation variants (signed/hist/peak/V-T/composite/spherical/64-bin) vs geometry+intensity refs, fixed CNN, cross-subject, mHomeGes+Infineon. Goal: a velocity-centered map that beats geometry, intensity AND the point-input baselines."
tags: [srep-gesture, repsweep, cross-subject]
resources:
  cluster: remilab-c0
  preset: gpu-rtx4090
image: nvcr.io/nvidia/pytorch:24.10-py3
env:
  PYTHONUNBUFFERED: "1"
  LANG: "C.UTF-8"
mount:
  /root/workspace/: volume://<your-volume>/
run: |-
  set -eu
  cd /root/workspace/bk-workspace/papers/Papers/On-going/SREP-hand-gesture/experiments/src
  python -m pip install -q pandas scipy scikit-learn
  python -c "import torch; print('torch', torch.__version__, '| cuda', torch.cuda.is_available())"
  python -u rep_variants.py
  echo "REPSWEEP DONE"
