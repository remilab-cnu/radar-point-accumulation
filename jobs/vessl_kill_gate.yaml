name: srep-gesture-kill-gate-headroom
description: "Oracle-headroom kill-gate: does CFAR discard gesture-class info an MI-selector recovers at equal point budget? (Infineon raw, CFAR vs energy vs relevance-oracle)"
tags: [srep-gesture, kill-gate, info-detection]
resources:
  cluster: remilab-c0
  preset: gpu-rtx4090
image: nvcr.io/nvidia/pytorch:24.10-py3
env:
  PYTHONUNBUFFERED: "1"
  LANG: "C.UTF-8"
mount:
  /root/workspace/: volume://<your-volume>/
run: |-
  set -eu
  cd /root/workspace/bk-workspace/papers/Papers/On-going/SREP-hand-gesture/experiments/src
  python -m pip install -q pandas scipy scikit-learn
  python -u kill_gate_headroom.py
  echo "KILL GATE DONE"
