name: srep-gesture-converge-point
description: "Cold-review S1+P5: point-domain convergence rerun (mH ep80/120, MM-Fi ep120/240) + velocity shuffle controls (in/cross), DeepSets, frozen protocol, preds+train-acc saved"
tags: [srep-gesture, cold-review, converge-point]
resources:
  cluster: remilab-c0
  preset: gpu-rtx4090
image: nvcr.io/nvidia/pytorch:24.10-py3
env:
  PYTHONUNBUFFERED: "1"
  LANG: "C.UTF-8"
mount:
  /root/workspace/: volume://<your-volume>/
run: |-
  set -eu
  cd /root/workspace/bk-workspace/papers/Papers/On-going/SREP-hand-gesture/experiments/src
  python -m pip install -q pandas scipy scikit-learn
  python -u rep_converge_point.py
  echo "CONVERGE POINT DONE"
