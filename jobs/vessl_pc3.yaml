name: srep-gesture-pc3-csubset
description: "P-C2 cancellation intervention: signed/hist velocity maps on MM-Fi (+mRI control), pre-registered gains"
tags: [srep-gesture, p2, mechanism, audit-compliant]
resources:
  cluster: remilab-c0
  preset: gpu-rtx4090
image: nvcr.io/nvidia/pytorch:24.10-py3
env:
  PYTHONUNBUFFERED: "1"
  LANG: "C.UTF-8"
mount:
  /root/workspace/: volume://<your-volume>/
run: |-
  set -eu
  cd /path/to/this/repo/src
  python -m pip install -q pandas scipy scikit-learn
  python -u pc3_csubset.py
  echo "P2 DONE"
