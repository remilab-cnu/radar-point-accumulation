name: srep-gesture-deepsets-lr
description: "N6 reviewer round: DeepSets lr=3e-4 sensitivity, 4 point-feature arms x 3 datasets x ep{30,40}, frozen protocol, preds saved (pairs vs existing 1e-3 in p1)"
tags: [srep-gesture, reviewer-round, lr-sensitivity, deepsets]
resources:
  cluster: remilab-c0
  preset: gpu-rtx4090
image: nvcr.io/nvidia/pytorch:24.10-py3
env:
  PYTHONUNBUFFERED: "1"
  LANG: "C.UTF-8"
mount:
  /root/workspace/: volume://<your-volume>/
run: |-
  set -eu
  cd /path/to/this/repo/src
  python -m pip install -q pandas scipy scikit-learn
  python -u rep_deepsets_lr.py
  echo "DEEPSETS_LR DONE"
