name: srep-gesture-final-infineon
description: "DECISIVE frozen-protocol run (audit spec): Infineon 2400, pre-registered arms (v_sum, composite, 3 refs, DeepSets, GRU) x ep30&40 x seeds 0-2, batch 64, no aug, per-instance predictions saved"
tags: [srep-gesture, final, audit-compliant]
resources:
  cluster: remilab-c0
  preset: gpu-rtx4090
image: nvcr.io/nvidia/pytorch:24.10-py3
env:
  PYTHONUNBUFFERED: "1"
  LANG: "C.UTF-8"
mount:
  /root/workspace/: volume://<your-volume>/
run: |-
  set -eu
  cd /path/to/this/repo/src
  python -m pip install -q pandas scipy scikit-learn
  python -u rep_final.py
  echo "FINAL DONE"
