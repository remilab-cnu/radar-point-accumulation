name: srep-gesture-mri-replication
description: "mRI 2nd whole-body dataset: pre-registered replication of the map-domain reversal (F-C) + point-domain velocity factorial, frozen protocol, preds saved"
tags: [srep-gesture, mri, replication, audit-compliant]
resources:
  cluster: remilab-c0
  preset: gpu-rtx4090
image: nvcr.io/nvidia/pytorch:24.10-py3
env:
  PYTHONUNBUFFERED: "1"
  LANG: "C.UTF-8"
mount:
  /root/workspace/: volume://<your-volume>/
run: |-
  set -eu
  cd /path/to/this/repo/src
  python -m pip install -q pandas scipy scikit-learn
  python -u rep_mri.py
  echo "MRI DONE"
