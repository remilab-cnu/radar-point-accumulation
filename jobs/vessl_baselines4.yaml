name: srep-gesture-baselines4-xiaxu
description: "Xia&Xu faithful row (Infineon raw cubes, MyNetV2, frozen-fold replay)"
tags: [srep-gesture, baselines, equal-hpo]
resources:
  cluster: remilab-c0
  preset: gpu-rtx4090
image: nvcr.io/nvidia/pytorch:24.10-py3
env:
  PYTHONUNBUFFERED: "1"
  LANG: "C.UTF-8"
mount:
  /root/workspace/: volume://<your-volume>/
run: |-
  set -eu
  cd /path/to/this/repo/src
  python -m pip install -q pandas scipy scikit-learn
  python -u run_baselines4.py
  echo "BASELINES1 DONE"
