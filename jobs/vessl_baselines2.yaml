name: srep-gesture-baselines2-pointlstm
description: "PointLSTM parity anchor: 3 datasets x ep30,40 x lr{3e-4,1e-3} x seeds 0-2, equal-HPO"
tags: [srep-gesture, baselines, equal-hpo]
resources:
  cluster: remilab-c0
  preset: gpu-rtx4090
image: nvcr.io/nvidia/pytorch:24.10-py3
env:
  PYTHONUNBUFFERED: "1"
  LANG: "C.UTF-8"
mount:
  /root/workspace/: volume://<your-volume>/
run: |-
  set -eu
  cd /root/workspace/bk-workspace/papers/Papers/On-going/SREP-hand-gesture/experiments/src
  python -m pip install -q pandas scipy scikit-learn
  python -u run_baselines2.py
  echo "BASELINES1 DONE"
