name: srep-gesture-medium-asks
description: "Panel medium asks: (A) MM-Fi 5-fold point ladder ep240 (B) mHomeGes map width-64 ep200 gate attempt (C) CPDP random-split driver probe"
tags: [srep-gesture, referee-revision, medium-asks]
resources:
  cluster: remilab-c0
  preset: gpu-rtx4090
image: nvcr.io/nvidia/pytorch:24.10-py3
env:
  PYTHONUNBUFFERED: "1"
  LANG: "C.UTF-8"
mount:
  /root/workspace/: volume://<your-volume>/
run: |-
  set -eu
  cd /root/workspace/bk-workspace/papers/Papers/On-going/SREP-hand-gesture/experiments/src
  python -m pip install -q pandas scipy scikit-learn
  python -u rep_medium_asks.py
  echo "MEDIUM ASKS DONE"
