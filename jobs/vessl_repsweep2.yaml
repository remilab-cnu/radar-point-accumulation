name: srep-gesture-repsweep-round2
description: "Rep sweep round 2: meanstd-centered combos + top round-1 variants, 40 epochs x 3 seeds (fix underfit/variance), mHomeGes+Infineon, in-config REFs"
tags: [srep-gesture, repsweep, round2]
resources:
  cluster: remilab-c0
  preset: gpu-rtx4090
image: nvcr.io/nvidia/pytorch:24.10-py3
env:
  PYTHONUNBUFFERED: "1"
  LANG: "C.UTF-8"
  REP_ROUND: "2"
mount:
  /root/workspace/: volume://<your-volume>/
run: |-
  set -eu
  cd /root/workspace/bk-workspace/papers/Papers/On-going/SREP-hand-gesture/experiments/src
  python -m pip install -q pandas scipy scikit-learn
  python -u rep_variants.py
  echo "ROUND2 DONE"
